products:
  almalinux-10.2-x86_64:
    distri: AlmaLinux
    flavor: Minimal
    version: "10.2"
    arch: x86_64

machines:
  64bit:
    backend: qemu
    settings:
      QEMUCPU: host
      QEMUCPUS: "2"

test_suites:
  create-base-image:
    settings:
      HDDSIZEGB: "20"
      PUBLISH_HDD_1: "%DISTRI%-%VERSION%-%BUILD%-%ARCH%.qcow2"
      YAML_SCHEDULE: schedule/create-base-image.yaml

  smoke:
    settings:
      OS_NAME: AlmaLinux
      BOOT_HDD_IMAGE: "1"
      HDD_1: "%DISTRI%-%VERSION%-%BUILD%-%ARCH%.qcow2"
      YAML_SCHEDULE: schedule/smoke.yaml
      START_AFTER_TEST: create-base-image

  network_server:
    settings:
      BOOT_HDD_IMAGE: "1"
      HDD_1: "%DISTRI%-%VERSION%-%BUILD%-%ARCH%.qcow2"
      NICTYPE: tap
      YAML_SCHEDULE: schedule/network_server.yaml
      START_AFTER_TEST: create-base-image

  network_client:
    settings:
      BOOT_HDD_IMAGE: "1"
      HDD_1: "%DISTRI%-%VERSION%-%BUILD%-%ARCH%.qcow2"
      NICTYPE: tap
      YAML_SCHEDULE: schedule/network_client.yaml
      START_AFTER_TEST: create-base-image
      PARALLEL_WITH: network_server

scenarios:
  x86_64:
    64bit:
      - create-base-image
      - smoke
      - network_server
      - network_client